<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <title>Reports - Staff Portal</title>
</head>
<body class="bg-light">

<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container mt-4 mb-5">
    <h3 class="mb-4">📊 Reports</h3>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card text-white bg-primary shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Total Employees</h6>
                    <p class="card-text display-6" th:text="${totalEmployees}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-success shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Active</h6>
                    <p class="card-text display-6" th:text="${activeEmployees}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-secondary shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Inactive</h6>
                    <p class="card-text display-6" th:text="${inactiveEmployees}">0</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header">Employees per Department</div>
                <div class="card-body">
                    <canvas id="deptChart" height="220"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header">Departments</div>
                <div class="card-body">
                    <table class="table table-sm mb-0">
                        <thead>
                            <tr><th>Name</th><th>Location</th><th># Employees</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="d : ${departments}">
                                <td th:text="${d.name}"></td>
                                <td th:text="${d.location}"></td>
                                <td th:text="${d.employees.size()}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const labels = /*[[${departmentCounts.keySet()}]]*/ [];
    const values = /*[[${departmentCounts.values()}]]*/ [];

    new Chart(document.getElementById('deptChart'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{ label: 'Employees', data: values, backgroundColor: '#0d6efd' }]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
        }
    });
</script>

</body>
</html>
