<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Attendance Register - VitalOps HR')}">
    <meta charset="utf-8">
    <title>Attendance Register - VitalOps HR</title>
</head>
<body>

<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container page-shell mt-4 mb-5">

    <div class="page-header">
        <div class="page-header-main">
            <p class="page-eyebrow">Time &amp; Attendance</p>
            <h1 class="page-title">Attendance Register</h1>
            <p class="page-sub">Staff record their hours under My Attendance. Use this register to review or log adjustments.</p>
        </div>
        <form method="get" class="d-flex align-items-center gap-2">
            <label class="form-label mb-0 fw-semibold text-muted small" for="regDate">Date:</label>
            <input id="regDate" type="date" name="date" class="form-control" th:value="${selectedDate}" onchange="this.form.submit()">
            <noscript><button type="submit" class="btn btn-outline-secondary btn-sm">Go</button></noscript>
        </form>
    </div>

    <div th:replace="~{fragments/flash :: flash}"></div>

    <div class="dx-metrics mb-4" th:if="${summary != null}">
        <div class="dx-metric" th:each="entry : ${summary}">
            <div class="dx-metric-label">
                <span class="dx-dot" th:classappend="${entry.key == 'Present' ? 'good' : (entry.key == 'Late' ? 'warn' : (entry.key == 'Absent' ? 'bad' : 'info'))}"></span>
                <span th:text="${entry.key}">Metric</span>
            </div>
            <p class="dx-metric-value" th:text="${entry.value}">0</p>
            <p class="dx-metric-note">for selected date</p>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-5">
            <section class="card shadow-sm h-100">
                <div class="card-header">
                    <h2>Record Attendance</h2>
                </div>
                <div class="card-body">
                    <form th:action="@{/attendance/record}" method="post">
                        <input type="hidden" name="date" th:value="${selectedDate}">
                        <div class="mb-3">
                            <label class="form-label" for="employeeId">Employee</label>
                            <select id="employeeId" name="employeeId" class="form-select" required>
                                <option value="">Choose an employee...</option>
                                <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.fullName}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="attStatus">Attendance Status</label>
                            <select id="attStatus" name="status" class="form-select" required>
                                <option value="PRESENT">Present</option>
                                <option value="ABSENT">Absent</option>
                                <option value="LATE">Late</option>
                                <option value="ON_LEAVE">On Leave</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="attNote">Note (optional)</label>
                            <input id="attNote" type="text" name="note" class="form-control" placeholder="Reason or observation">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save Attendance Entry</button>
                    </form>
                </div>
            </section>
        </div>

        <div class="col-lg-7">
            <section class="card shadow-sm h-100">
                <div class="card-header">
                    <h2>Records for <span class="text-primary" th:text="${selectedDate}">Date</span></h2>
                </div>
                <div class="card-body p-0">
                    <div class="table-shell m-0 border-0 shadow-none">
                        <table class="table align-middle mb-0">
                            <thead>
                            <tr><th>Employee</th><th>Status</th><th>In</th><th>Out</th><th>Worked</th><th>Note</th></tr>
                            </thead>
                            <tbody>
                            <tr th:if="${records.isEmpty()}">
                                <td colspan="6" class="dx-empty text-center py-4">
                                    <p class="text-muted mb-0">No records for this date yet.</p>
                                </td>
                            </tr>
                            <tr th:each="r : ${records}">
                                <td class="fw-semibold text-dark" th:text="${r.employee.fullName}"></td>
                                <td>
                                    <span class="dx-chip"
                                          th:classappend="${r.status.name() == 'PRESENT' ? 'good' : (r.status.name() == 'LATE' ? 'warn' : (r.status.name() == 'ABSENT' ? 'bad' : 'info'))}"
                                          th:text="${r.status}">Present</span>
                                </td>
                                <td class="dx-time" th:text="${r.checkIn != null ? #temporals.format(r.checkIn, 'HH:mm') : '-'}">-</td>
                                <td class="dx-time" th:text="${r.checkOut != null ? #temporals.format(r.checkOut, 'HH:mm') : '-'}">-</td>
                                <td class="dx-time fw-medium" th:text="${r.workedLabel}">-</td>
                                <td class="text-muted small" th:text="${r.note ?: '-'}">-</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

</body>
</html>
