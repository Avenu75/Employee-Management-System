<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Employees - Staff Portal</title>
</head>
<body class="bg-light">

<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container mt-4 mb-5">

    <!-- Flash success message, shown once after add / update / delete -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Employee Directory</h3>
        <div>
            <a th:href="@{/employees/showFormForAdd}" class="btn btn-primary btn-sm"
               sec:authorize="hasAnyAuthority('CAN_ADD_EMPLOYEE','SUPER_ADMIN')">➕ Add Employee</a>
            <a th:href="@{/employees/export}" class="btn btn-outline-success btn-sm"
               sec:authorize="hasAnyAuthority('CAN_VIEW_REPORTS','CAN_VIEW_EMPLOYEE','SUPER_ADMIN')">⬇️ Export CSV</a>
        </div>
    </div>

    <!-- Search box -->
    <form th:action="@{/employees/list}" method="get" class="row g-2 mb-3">
        <div class="col-auto">
            <input type="text" name="keyword" th:value="${keyword}"
                   class="form-control" placeholder="Search by name or email...">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">🔍 Search</button>
        </div>
        <div class="col-auto" th:if="${keyword != null and !keyword.isEmpty()}">
            <a th:href="@{/employees/list}" class="btn btn-outline-secondary">Clear</a>
        </div>
    </form>

    <table class="table table-bordered table-striped bg-white shadow-sm">
        <thead class="table-dark">
            <tr>
                <th><a class="text-white text-decoration-none" th:href="@{/employees/list(sortBy='firstName', keyword=${keyword})}">First Name</a></th>
                <th><a class="text-white text-decoration-none" th:href="@{/employees/list(sortBy='lastName', keyword=${keyword})}">Last Name</a></th>
                <th>Email</th>
                <th>Job Title</th>
                <th>Department</th>
                <th><a class="text-white text-decoration-none" th:href="@{/employees/list(sortBy='salary', keyword=${keyword})}">Salary</a></th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr th:if="${employees.isEmpty()}">
                <td colspan="8" class="text-center text-muted py-4">No employees found.</td>
            </tr>
            <tr th:each="tempEmployee : ${employees}">
                <td th:text="${tempEmployee.firstName}"></td>
                <td th:text="${tempEmployee.lastName}"></td>
                <td th:text="${tempEmployee.email}"></td>
                <td th:text="${tempEmployee.jobTitle}"></td>
                <td th:text="${tempEmployee.department != null ? tempEmployee.department.name : '-'}"></td>
                <td th:text="${'$' + tempEmployee.salary}"></td>
                <td>
                    <span th:if="${tempEmployee.status.name() == 'ACTIVE'}" class="badge bg-success">Active</span>
                    <span th:if="${tempEmployee.status.name() == 'INACTIVE'}" class="badge bg-secondary">Inactive</span>
                </td>
                <td>
                    <a th:href="@{/employees/showFormForUpdate(employeeId=${tempEmployee.id})}"
                       class="btn btn-info btn-sm" sec:authorize="hasAnyAuthority('CAN_EDIT_EMPLOYEE','SUPER_ADMIN')">
                        Update
                    </a>
                    <button type="button"
                            class="btn btn-danger btn-sm delete-employee-btn"
                            sec:authorize="hasAnyAuthority('CAN_DELETE_EMPLOYEE','SUPER_ADMIN')"
                            th:attr="data-delete-url=@{/employees/delete(employeeId=${tempEmployee.id})},data-employee-name=${tempEmployee.fullName}">
                        Delete
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Pagination controls -->
    <nav th:if="${employeePage.totalPages > 1}" aria-label="Employee pagination">
        <ul class="pagination">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/employees/list(page=${currentPage - 1}, keyword=${keyword}, sortBy=${sortBy})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, employeePage.totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/employees/list(page=${i}, keyword=${keyword}, sortBy=${sortBy})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == employeePage.totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/employees/list(page=${currentPage + 1}, keyword=${keyword}, sortBy=${sortBy})}">Next</a>
            </li>
        </ul>
    </nav>

</div>

<!-- Clean confirmation modal for deleting an employee (replaces raw browser confirm()) -->
<div class="modal fade" id="confirmDeleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Delete Employee?</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete <strong id="deleteEmployeeName"></strong>?
                This action cannot be undone.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <a href="#" id="confirmDeleteLink" class="btn btn-danger">Yes, Delete</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.delete-employee-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.getElementById('deleteEmployeeName').textContent = btn.getAttribute('data-employee-name');
            document.getElementById('confirmDeleteLink').setAttribute('href', btn.getAttribute('data-delete-url'));
            const modal = new bootstrap.Modal(document.getElementById('confirmDeleteModal'));
            modal.show();
        });
    });
</script>

</body>
</html>
