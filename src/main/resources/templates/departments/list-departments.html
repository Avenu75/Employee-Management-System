<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Departments - Staff Portal</title>
</head>
<body class="bg-light">

<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container mt-4 mb-5">

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Departments</h3>
        <a th:href="@{/departments/showFormForAdd}" class="btn btn-primary btn-sm"
           sec:authorize="hasAnyAuthority('CAN_MANAGE_DEPARTMENT','SUPER_ADMIN')">➕ Add Department</a>
    </div>

    <table class="table table-bordered table-striped bg-white shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Location</th>
                <th># Employees</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="dept : ${departments}">
                <td th:text="${dept.name}"></td>
                <td th:text="${dept.location}"></td>
                <td th:text="${dept.employees.size()}"></td>
                <td>
                    <a th:href="@{/departments/showFormForUpdate(departmentId=${dept.id})}"
                       class="btn btn-info btn-sm" sec:authorize="hasAnyAuthority('CAN_MANAGE_DEPARTMENT','SUPER_ADMIN')">Update</a>
                    <button type="button" class="btn btn-danger btn-sm delete-department-btn"
                            sec:authorize="hasAnyAuthority('CAN_MANAGE_DEPARTMENT','SUPER_ADMIN')"
                            th:attr="data-delete-url=@{/departments/delete(departmentId=${dept.id})},data-department-name=${dept.name}">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>

</div>

<!-- Clean confirmation modal for deleting a department (replaces raw browser confirm()) -->
<div class="modal fade" id="confirmDeleteDeptModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Delete Department?</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete <strong id="deleteDepartmentName"></strong>?
                Employees currently in it will be unassigned, not deleted.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <a href="#" id="confirmDeleteDeptLink" class="btn btn-danger">Yes, Delete</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.delete-department-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.getElementById('deleteDepartmentName').textContent = btn.getAttribute('data-department-name');
            document.getElementById('confirmDeleteDeptLink').setAttribute('href', btn.getAttribute('data-delete-url'));
            const modal = new bootstrap.Modal(document.getElementById('confirmDeleteDeptModal'));
            modal.show();
        });
    });
</script>

</body>
</html>
