<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${department.id == 0 ? 'Add Department - VitalOps HR' : 'Edit Department - VitalOps HR'})}">
    <meta charset="utf-8">
    <title>Department Form - VitalOps HR</title>
</head>
<body>

<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container page-shell mt-4 mb-5">

    <div class="page-header">
        <div class="page-header-main">
            <p class="page-eyebrow"><a th:href="@{/departments/list}">&larr; Departments</a></p>
            <h1 class="page-title" th:text="${department.id == 0} ? 'Add Department' : 'Edit Department'">Department</h1>
            <p class="page-sub">Configure department name, organizational scope, and facility location.</p>
        </div>
    </div>

    <div th:replace="~{fragments/flash :: flash}"></div>

    <div class="card form-card shadow-sm">
        <div class="card-body p-4 p-sm-5">
            <form th:action="@{/departments/save}" th:object="${department}" method="POST">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label" for="deptName">Department Name</label>
                    <input id="deptName" type="text" th:field="*{name}" class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" required autofocus>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="deptLocation">Location / Office</label>
                    <input id="deptLocation" type="text" th:field="*{location}" class="form-control"
                           th:classappend="${#fields.hasErrors('location')} ? 'is-invalid'"
                           placeholder="e.g. Building A - Floor 3" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
                </div>

                <div class="d-flex align-items-center gap-2 pt-2 border-top">
                    <button type="submit" class="btn btn-primary px-4">Save Department</button>
                    <a th:href="@{/departments/list}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
