<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Update My Profile - VitalOps HR')}"></head>
<body>

<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="page-shell">
    <div class="page-header mb-4">
        <div class="page-header-main">
            <p class="page-eyebrow">Account Settings</p>
            <h1 class="page-title">Update Profile</h1>
            <p class="page-sub">Keep your contact details, personal information, and profile picture current.</p>
        </div>
        <div class="page-actions">
            <a th:href="@{/profile}" class="btn btn-outline-secondary btn-sm">Cancel</a>
        </div>
    </div>

    <div th:replace="~{fragments/flash :: flash}"></div>

    <div class="form-card-wide mx-auto">
        <form th:action="@{/profile/update}" th:object="${employee}" method="post" enctype="multipart/form-data">
            <div class="row g-4">
                <div class="col-md-4 text-center">
                    <img th:src="${employee != null and employee.profileImage != null and !#strings.isEmpty(employee.profileImage) ? employee.profileImage : '/images/default-avatar.svg'}"
                         class="profile-avatar border shadow-sm mb-3"
                         alt="Profile photo">
                    <div class="text-start">
                        <label class="form-label">Upload New Photo</label>
                        <input type="file" name="profilePhoto" class="form-control form-control-sm" accept="image/*">
                        <div class="form-text">JPG, PNG or GIF up to 5MB.</div>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">First Name <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{firstName}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Last Name <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{lastName}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email Address <span class="text-danger">*</span></label>
                            <input type="email" th:field="*{email}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone Number</label>
                            <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="+1 555-0123">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date of Birth</label>
                            <input type="date" th:field="*{dateOfBirth}" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">National ID / SSN</label>
                            <input type="text" th:field="*{nationalId}" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Gender</label>
                            <select th:field="*{gender}" class="form-select">
                                <option value="">-- Select --</option>
                                <option th:each="g : ${genders}" th:value="${g}" th:text="${g}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Position / Role</label>
                            <input type="text" th:field="*{jobTitle}" class="form-control">
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-top d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a th:href="@{/profile}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</main>

</body>
</html>
