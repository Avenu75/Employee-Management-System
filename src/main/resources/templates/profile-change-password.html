<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Change Password - VitalOps HR')}"></head>
<body>

<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="page-shell">
    <div class="page-header mb-4">
        <div class="page-header-main">
            <p class="page-eyebrow">Account Security</p>
            <h1 class="page-title">Change Password</h1>
            <p class="page-sub">Update your authentication password to maintain account security.</p>
        </div>
        <div class="page-actions">
            <a th:href="@{/profile}" class="btn btn-outline-secondary btn-sm">Back to Profile</a>
        </div>
    </div>

    <div th:replace="~{fragments/flash :: flash}"></div>

    <div class="form-card mx-auto" style="max-width: 520px;">
        <div th:if="${errorMessage}" class="alert alert-danger mb-4" th:text="${errorMessage}"></div>

        <form th:action="@{/profile/change-password}" method="post">
            <div class="mb-3">
                <label for="currentPassword" class="form-label">Current Password <span class="text-danger">*</span></label>
                <input type="password" id="currentPassword" name="currentPassword" class="form-control" autocomplete="current-password" required>
            </div>
            <div class="mb-3">
                <label for="newPassword" class="form-label">New Password <span class="text-danger">*</span></label>
                <input type="password" id="newPassword" name="newPassword" class="form-control" minlength="6" autocomplete="new-password" required>
                <div class="form-text">Minimum 6 characters. Use letters, numbers, and symbols for best security.</div>
            </div>
            <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirm New Password <span class="text-danger">*</span></label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" minlength="6" autocomplete="new-password" required>
            </div>
            <div class="d-flex align-items-center gap-2 pt-2 border-top">
                <button type="submit" class="btn btn-primary">Update Password</button>
                <a th:href="@{/profile}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
