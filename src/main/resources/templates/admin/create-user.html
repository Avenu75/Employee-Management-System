<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Create Staff Account - VitalOps HR')}"></head>
<body>

<div th:replace="~{fragments/nav :: navbar}"></div>

<main class="page-shell">
    <div class="page-header mb-4">
        <div class="page-header-main">
            <p class="page-eyebrow">Access Management</p>
            <h1 class="page-title">Create Account</h1>
            <p class="page-sub">Provision login credentials and link to an existing employee profile if available.</p>
        </div>
        <div class="page-actions">
            <a th:href="@{/admin/users}" class="btn btn-outline-secondary btn-sm">Back to Accounts</a>
        </div>
    </div>

    <div th:replace="~{fragments/flash :: flash}"></div>

    <div class="form-card mx-auto" style="max-width: 680px;">
        <div th:replace="~{admin/account-tabs :: tabs('employee')}"></div>

        <div th:if="${errorMessage}" class="alert alert-danger mb-4" th:text="${errorMessage}"></div>

        <form th:action="@{/admin/users/new}" th:object="${newUserForm}" method="POST">
            <div class="mb-3">
                <label class="form-label">Username <span class="text-danger">*</span></label>
                <input type="text" th:field="*{username}" class="form-control" autocomplete="off"
                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Temporary Password <span class="text-danger">*</span></label>
                <input type="text" th:field="*{password}" class="form-control" autocomplete="off"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                <div class="form-text">The new user should change this password after their first login.</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Full Name <span class="text-danger">*</span></label>
                <input type="text" th:field="*{fullName}" class="form-control"
                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="user@company.com">
            </div>

            <div class="mb-4">
                <label class="form-label">Link to Employee Record (optional)</label>
                <select th:field="*{employeeId}" class="form-select">
                    <option value="">-- None --</option>
                    <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.fullName}"></option>
                </select>
                <div class="form-text">Required if this account needs to track personal clock-ins or leave requests.</div>
            </div>

            <div class="d-flex align-items-center gap-2 pt-2 border-top">
                <button type="submit" class="btn btn-primary">Create Account</button>
                <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
