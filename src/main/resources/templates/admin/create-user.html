<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Create Staff Account - Staff Portal</title>
</head>
<body class="bg-light">

<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container mt-4 mb-5">
    <div class="card shadow-sm" style="max-width: 650px; margin: 0 auto;">
        <div class="card-body">
            <h4 class="card-title mb-4">Create Staff Account</h4>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/admin/users/new}" th:object="${newUserForm}" method="POST">

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" th:field="*{username}" class="form-control"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Temporary Password</label>
                    <input type="text" th:field="*{password}" class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    <div class="form-text">The new user should change this after their first login.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="text" th:field="*{email}" class="form-control">
                </div>

                <div class="mb-4">
                    <label class="form-label">Link to Employee Record (optional)</label>
                    <select th:field="*{employeeId}" class="form-select">
                        <option value="">-- None --</option>
                        <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.fullName}"></option>
                    </select>
                    <div class="form-text">Only needed if this login should be linked to an existing HR record.</div>
                </div>

                <button type="submit" class="btn btn-primary">Create Account</button>
                <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
