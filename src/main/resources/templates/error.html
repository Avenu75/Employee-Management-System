<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Error - VitalOps HR')}">
    <meta charset="utf-8">
    <title>Error - VitalOps HR</title>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
<div class="container text-center">
    <div class="card form-card p-4 p-sm-5 mx-auto text-center">
        <div class="mb-3">
            <span class="badge bg-danger px-3 py-2">System Error</span>
        </div>
        <h2 class="fw-bold mb-2">Something went wrong</h2>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred. Please return to the dashboard.'}">An error occurred.</p>
        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/dashboard}" class="btn btn-primary">Back to Dashboard</a>
            <a th:href="@{/}" class="btn btn-outline-secondary">Home</a>
        </div>
    </div>
</div>
</body>
</html>
