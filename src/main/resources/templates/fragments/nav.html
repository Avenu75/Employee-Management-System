<!-- Reusable navigation bar fragment.
     Included in every authenticated page with: th:replace="~{fragments/nav :: navbar}"
     Every link is wrapped in sec:authorize so a user only ever sees
     navigation entries for things they are actually allowed to do - this
     is a UX nicety on top of the real @PreAuthorize enforcement in the
     Controllers (never a substitute for it). -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark px-3 shadow-sm">
    <a class="navbar-brand" th:href="@{/}">🏢 Acme Small Business - Staff Portal</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav me-auto">
            <li class="nav-item" sec:authorize="hasAnyAuthority('SUPER_ADMIN')">
                <a class="nav-link" th:href="@{/admin/dashboard}">🛡️ Admin</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyAuthority('SUPER_ADMIN')">
                <a class="nav-link" th:href="@{/admin/privileges}">Privileges</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyAuthority('SUPER_ADMIN')">
                <a class="nav-link" th:href="@{/admin/users}">Staff Accounts</a>
            </li>
            <li class="nav-item"
                sec:authorize="hasAnyAuthority('CAN_VIEW_EMPLOYEE','CAN_ADD_EMPLOYEE','CAN_EDIT_EMPLOYEE','CAN_DELETE_EMPLOYEE','CAN_VIEW_DEPARTMENT','CAN_MANAGE_DEPARTMENT','CAN_VIEW_REPORTS','CAN_MANAGE_ATTENDANCE')">
                <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyAuthority('CAN_VIEW_EMPLOYEE')">
                <a class="nav-link" th:href="@{/employees/list}">Employees</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyAuthority('CAN_VIEW_DEPARTMENT','CAN_MANAGE_DEPARTMENT')">
                <a class="nav-link" th:href="@{/departments/list}">Departments</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyAuthority('CAN_VIEW_REPORTS')">
                <a class="nav-link" th:href="@{/reports}">Reports</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyAuthority('CAN_MANAGE_ATTENDANCE')">
                <a class="nav-link" th:href="@{/attendance}">Attendance</a>
            </li>
            <li class="nav-item"
                sec:authorize="!hasAnyAuthority('SUPER_ADMIN','CAN_VIEW_EMPLOYEE','CAN_ADD_EMPLOYEE','CAN_EDIT_EMPLOYEE','CAN_DELETE_EMPLOYEE','CAN_VIEW_DEPARTMENT','CAN_MANAGE_DEPARTMENT','CAN_VIEW_REPORTS','CAN_MANAGE_ATTENDANCE')">
                <a class="nav-link" th:href="@{/profile}">My Profile</a>
            </li>
        </ul>
        <ul class="navbar-nav">
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <span class="navbar-text text-light me-3">
                    Signed in as <strong sec:authentication="name">user</strong>
                    <span class="badge bg-warning text-dark ms-1" sec:authorize="hasAuthority('SUPER_ADMIN')">Super Admin</span>
                </span>
            </li>
            <li class="nav-item">
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
                </form>
            </li>
        </ul>
    </div>
</nav>
