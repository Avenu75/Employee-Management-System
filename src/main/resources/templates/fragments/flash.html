<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="flash" class="flash-messages">
        <div th:if="${successMessage != null and !#strings.isEmpty(successMessage)}" class="alert alert-success alert-dismissible fade show" role="status">
            <span th:text="${successMessage}">Operation successful.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage != null and !#strings.isEmpty(errorMessage)}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}">An error occurred.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
</body>
</html>
