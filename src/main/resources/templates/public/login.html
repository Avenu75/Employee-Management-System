<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Login - Staff Portal</title>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b2a41 100%);
        }
        .login-card {
            border: none;
            border-radius: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <a th:href="@{/}" class="text-decoration-none">
                    <span class="fs-3 fw-bold text-white">🏢 Acme Small Business</span>
                </a>
            </div>

            <div class="card login-card shadow-lg">
                <div class="card-body p-5">
                    <h4 class="fw-bold mb-1">Welcome back</h4>
                    <p class="text-muted mb-4">Sign in to access the Staff Portal.</p>

                    <div th:if="${param.error}" class="alert alert-danger py-2">
                        Invalid username or password.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success py-2">
                        You have been signed out.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control form-control-lg" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control form-control-lg" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">Sign In</button>
                    </form>
                </div>
            </div>

            <p class="text-center text-white-50 mt-4">
                <small>Access is by invitation only. Contact your administrator if you need an account.</small>
            </p>
        </div>
    </div>
</div>

</body>
</html>
