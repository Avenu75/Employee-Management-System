#
# =====================================================================
#  Application configuration
# =====================================================================

# ---- Application info ----
spring.application.name=Employee Management System

# ---- Server ----
# Railway (and most PaaS providers) assign a port dynamically via the PORT
# environment variable. Falls back to 8080 for local development.
server.port=${PORT:8080}

# ---- JDBC / Database connection ----
# Values are read from environment variables so real credentials are never
# committed to source control. Sensible local-development defaults are
# provided after the ':' so the app still runs out-of-the-box for grading/demo
# purposes without requiring the environment variables to be set.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/employee_directory}
spring.datasource.username=${DB_USERNAME:springstudent}
spring.datasource.password=${DB_PASSWORD:springstudent}

# Hibernate dialect - set explicitly to avoid dialect auto-detection issues
# with some MySQL-compatible servers (e.g. MariaDB) during startup.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Do not let Hibernate change the DB schema automatically in this project -
# the schema is fully managed by sql-scripts/employee-directory.sql.
spring.jpa.hibernate.ddl-auto=none

# Log the generated SQL statements to the console - useful for the demo/presentation
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

# ---- Thymeleaf ----
# Disable template caching so template edits are picked up without restarting (dev convenience)
spring.thymeleaf.cache=false

# ---- Logging ----
logging.level.com.rainbow.springboot.thymeleafdemo=INFO
logging.level.org.springframework.security=WARN

# ---- Single Super Admin seeding ----
# Read from environment variables so the real production password is never
# committed to source control. These defaults are for local development /
# grading only - DataInitializer prints a warning reminding you to change
# the password if you keep the default.
app.super-admin.username=${SUPER_ADMIN_USERNAME:superadmin}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:ChangeMe123!}
app.super-admin.full-name=${SUPER_ADMIN_FULL_NAME:System Administrator}
app.super-admin.email=${SUPER_ADMIN_EMAIL:admin@acme.local}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8

# ---- File uploads ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# ---- Session / cookie hardening ----
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set COOKIE_SECURE=true when served over HTTPS (production).
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m

# ---- Never leak internals in error responses ----
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# ---- Login throttling (see LoginThrottleFilter) ----
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# Set FORWARD_HEADERS=framework when running behind a reverse proxy/load balancer
# so client IPs (used by login throttling) and HTTPS are detected correctly.
server.forward-headers-strategy=${FORWARD_HEADERS:none}

# ---- Leave, attendance and payroll ----
# Annual leave allowance in working days per calendar year.
app.leave.annual-days=${LEAVE_ANNUAL_DAYS:21}
# A check-in later than work-start + grace-minutes is recorded as LATE.
app.attendance.work-start=${WORK_START:09:00}
app.attendance.grace-minutes=${WORK_GRACE_MINUTES:15}
# Payroll: the salary on an employee record is treated as MONTHLY gross.
# Tax, pension, dues and allowances are NOT set here any more: they are set in the
# application under Payroll > Tax and deductions (run sql-scripts/payroll-migration.sql once).
app.currency=${APP_CURRENCY:$}
